      <div style="max-width:800px;margin:40px auto;padding:0 24px;font-family:serif;color:#2b2318">
        <h1>불진 佛津 — 대장경 원문 근거 인공지능 선문답 및 디지털 산사 대장경 플랫폼</h1>
        <p>현대어로 대장경에 질문하면, 선지식 AI가 경전 원문에 입각하여 답변합니다. 답변의 모든 인용 구절에는 경전명과 권호가 표기되어 원전과 즉시 대조할 수 있습니다. <strong>원문으로 직접 확인하고 참구하는 디지털 불경 플랫폼</strong>입니다.</p>
        <h2>주요 기능</h2>
        <ul>
          <li><strong>선문답(AI 문답)</strong> — 대장경 원문을 검색하여 답변하고 인용 출처를 대조</li>
          <li><strong>역대 조사 법문</strong> — 역사적 선지식의 시각에서 종파별 소의경전에 기반하여 답변</li>
          <li><strong>삼장 대조</strong> — 한문본·남전 팔리어본·티베트어본 다국어 구절 대조</li>
          <li><strong>경장 검색</strong> — 전 세계 대장경 자료원을 통합 검색, 경전명·편차·역관별 상세 조회</li>
          <li><strong>불교 사전</strong> — 한문·산스크리트어·팔리어·티베트어 다언어 불교 용어 사전</li>
          <li><strong>법맥도(지식 그래프)</strong> — 인물·사찰·종파의 전승 계보와 지리적 연계 시각화</li>
        </ul>
        <h2>자료 출처</h2>
        <p>CBETA, BDRC, SAT, SuttaCentral, 84000 등 권위 있는 불교 디지털 아카이브 자원을 연계합니다.</p>
